databaseChangeLog:
  - changeSet:
      author: MohammadWS
      id: 003-encrypt-system-admin-user
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM users WHERE username = 'sysadmin' AND (password IS NULL OR NOT (password LIKE '$2_$__$%' AND LEN(password) = 60))
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  value: '${sysadmin.password.hash}'
            where: username = 'sysadmin'