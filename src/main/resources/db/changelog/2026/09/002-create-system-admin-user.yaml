databaseChangeLog:
  - changeSet:
      author: MohammadWS
      id: 002-create-system-admin-user
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE username = 'sysadmin'
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: username, value: 'sysadmin' }
              - column: { name: password, value: 'sysadmin' }
              - column: { name: email, value: 'sysadmin@mail.com' }
              - column: { name: enabled, value: true }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
      rollback:
        - delete:
            tableName: users
            where: username = 'sysadmin'